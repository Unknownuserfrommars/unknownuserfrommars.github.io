<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal website of Unknownuserfrommars, currently under construction.">
  <title>Unknownuserfrommars | Launching Soon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
          },
          animation: {
            'float-slow': 'float 8s ease-in-out infinite',
            'float-delay': 'float 10s ease-in-out 1.5s infinite',
            'pulse-glow': 'pulseGlow 3s ease-in-out infinite'
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
              '50%': { transform: 'translateY(-18px) rotate(3deg)' }
            },
            pulseGlow: {
              '0%, 100%': { boxShadow: '0 0 38px rgba(129, 140, 248, 0.38)' },
              '50%': { boxShadow: '0 0 78px rgba(34, 211, 238, 0.44)' }
            }
          }
        }
      }
    };
  </script>
  <style>
    [v-cloak] { display: none; }
  </style>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js" defer></script>
  <script src="./script.js" defer></script>
</head>
<body class="min-h-screen overflow-hidden bg-slate-950 font-display text-slate-100 antialiased">
  <main id="app" v-cloak class="relative isolate flex min-h-screen items-center justify-center px-6 py-12">
    <div class="absolute inset-0 -z-20 bg-[radial-gradient(circle_at_20%_20%,rgba(56,189,248,0.24),transparent_32%),radial-gradient(circle_at_80%_10%,rgba(168,85,247,0.22),transparent_30%),radial-gradient(circle_at_50%_90%,rgba(45,212,191,0.16),transparent_34%)]"></div>
    <div class="absolute inset-0 -z-10 bg-[linear-gradient(rgba(148,163,184,0.08)_1px,transparent_1px),linear-gradient(90deg,rgba(148,163,184,0.08)_1px,transparent_1px)] bg-[size:44px_44px] [mask-image:linear-gradient(to_bottom,black,transparent_85%)]"></div>

    <div class="absolute left-8 top-10 h-24 w-24 rounded-full bg-cyan-300/20 blur-2xl animate-float-slow"></div>
    <div class="absolute bottom-14 right-12 h-32 w-32 rounded-full bg-fuchsia-400/20 blur-2xl animate-float-delay"></div>

    <section class="w-full max-w-5xl rounded-[2rem] border border-white/10 bg-white/[0.07] p-6 shadow-2xl shadow-cyan-950/40 backdrop-blur md:p-10">
      <div class="grid items-center gap-10 lg:grid-cols-[1.05fr_0.95fr]">
        <div>
          <p class="mb-5 inline-flex items-center gap-2 rounded-full border border-cyan-300/30 bg-cyan-300/10 px-4 py-2 text-sm font-medium text-cyan-100">
            <span class="h-2 w-2 rounded-full bg-emerald-300 animate-pulse"></span>
            {{ status }}
          </p>

          <h1 class="max-w-3xl text-5xl font-black tracking-tight text-white sm:text-6xl lg:text-7xl">
            Something cosmic is
            <span class="block bg-gradient-to-r from-cyan-200 via-indigo-200 to-fuchsia-200 bg-clip-text text-transparent">landing soon.</span>
          </h1>

          <p class="mt-6 max-w-2xl text-lg leading-8 text-slate-300">
            Unknownuserfrommars is rebuilding this corner of the internet. Expect experiments, notes, projects, and a few tiny transmissions from orbit.
          </p>

          <div class="mt-8 flex flex-col gap-3 sm:flex-row">
            <a href="https://github.com/unknownuserfrommars" class="rounded-full bg-cyan-300 px-6 py-3 text-center text-sm font-bold text-slate-950 transition hover:-translate-y-0.5 hover:bg-cyan-200 focus:outline-none focus:ring-4 focus:ring-cyan-300/30">
              Follow the build
            </a>
            <a href="https://github.com/unknownuserfrommars" class="rounded-full border border-white/15 bg-white/10 px-6 py-3 text-center text-sm font-bold text-white transition hover:-translate-y-0.5 hover:bg-white/15 focus:outline-none focus:ring-4 focus:ring-white/20">
              Visit GitHub
            </a>
          </div>
        </div>

        <div class="relative mx-auto aspect-square w-full max-w-sm">
          <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-cyan-300/30 via-indigo-400/20 to-fuchsia-300/30 blur-3xl animate-pulse-glow"></div>
          <div class="relative flex h-full items-center justify-center rounded-full border border-white/15 bg-slate-900/70 shadow-2xl">
            <div class="absolute inset-8 rounded-full border border-dashed border-cyan-200/25 animate-[spin_24s_linear_infinite]"></div>
            <div class="absolute inset-16 rounded-full border border-dashed border-fuchsia-200/20 animate-[spin_32s_linear_infinite_reverse]"></div>
            <div class="relative text-center">
              <div class="mx-auto mb-5 flex h-28 w-28 items-center justify-center rounded-full bg-gradient-to-br from-cyan-200 to-fuchsia-300 text-6xl shadow-xl shadow-cyan-500/20">
                🚀
              </div>
              <p class="text-sm uppercase tracking-[0.4em] text-cyan-100/80">Under</p>
              <p class="text-3xl font-black text-white">Construction</p>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-10 grid gap-4 border-t border-white/10 pt-8 sm:grid-cols-3">
        <article v-for="item in highlights" :key="item.title" class="rounded-2xl border border-white/10 bg-slate-950/35 p-5">
          <p class="text-2xl">{{ item.icon }}</p>
          <h2 class="mt-3 font-bold text-white">{{ item.title }}</h2>
          <p class="mt-2 text-sm leading-6 text-slate-400">{{ item.copy }}</p>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
